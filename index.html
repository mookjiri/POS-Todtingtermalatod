<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Todtingtermalatod POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Kanit:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- Firebase (compat SDK — kept simple so the rest of the app's code barely changes) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
:root{
  --ink:#0F2A2E;
  --teal-900:#0B3B36;
  --teal-700:#0F6B5C;
  --teal-600:#137A68;
  --teal-100:#E4F3EF;
  --amber:#E8A33D;
  --amber-ink:#5C3A0A;
  --paper:#F6F5F1;
  --card:#FFFFFF;
  --line:#E2E1DA;
  --danger:#C1502E;
  --danger-bg:#FBE9E3;
  --muted:#6B7A78;
  --radius:14px;
  --shadow:0 2px 10px rgba(15,42,46,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Sarabun',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
h1,h2,h3,.disp{font-family:'Kanit',sans-serif}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
a{color:var(--teal-700)}
::-webkit-scrollbar{width:0;height:0}

/* ===== Layout shell ===== */
#app{display:none;height:100dvh;flex-direction:column}
#app.show{display:flex}
.topbar{
  background:var(--teal-900);color:#fff;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.topbar .shopname{font-family:'Kanit',sans-serif;font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
.topbar .shopname img{width:28px;height:28px;border-radius:8px;object-fit:cover}
.topbar .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9}
.icon-btn{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background-color .15s ease}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.alert-strip{background:var(--danger-bg);color:var(--danger);font-size:13px;padding:8px 16px;display:none;flex-shrink:0;font-weight:600}
.alert-strip.show{display:block}

#main{flex:1;overflow-y:auto;padding:14px 14px 90px 14px}
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  display:flex;overflow-x:auto;z-index:50;padding:4px 2px;gap:2px;
  box-shadow:0 -2px 10px rgba(0,0,0,.05);
}
.nav-btn{flex:0 0 auto;min-width:66px;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 8px;border-radius:10px;font-size:11px;transition:background-color .15s ease,color .15s ease}
.nav-btn .em{font-size:19px}
.nav-btn:hover{background:var(--teal-100);color:var(--teal-700)}
.nav-btn.active{color:var(--teal-700);background:var(--teal-100)}

/* ===== Tablet / desktop: side rail navigation ===== */
@media (min-width:900px){
  #app{flex-direction:row}
  .bottomnav{
    position:fixed;left:0;top:0;bottom:0;right:auto;width:236px;height:100dvh;
    flex-direction:column;align-items:stretch;justify-content:flex-start;
    padding:86px 12px 16px;gap:3px;border-top:none;border-right:1px solid var(--line);
    overflow-y:auto;overflow-x:hidden;box-shadow:none;
  }
  .nav-btn{flex-direction:row;justify-content:flex-start;gap:11px;padding:11px 14px;font-size:13.5px;min-width:0}
  .nav-btn .em{font-size:18px}
  .topbar{position:fixed;left:236px;right:0;top:0;z-index:40}
  .alert-strip{position:fixed;left:236px;right:0;top:57px;z-index:39}
  #main{margin-left:236px;padding:26px 32px 48px;max-width:1180px;margin-top:57px}
  .cart-fab{left:calc(236px + 20px);right:24px;bottom:24px;max-width:640px;margin:0 auto}
  .prod-grid{grid-template-columns:repeat(4,1fr)}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .sidebar-brand{display:flex}
  .topbar .shopname{display:none}
  .topbar{justify-content:flex-end}
}
.sidebar-brand{
  display:none;position:fixed;left:0;top:0;width:236px;padding:16px 18px;align-items:center;gap:10px;
  font-family:'Kanit',sans-serif;font-weight:700;font-size:15px;color:var(--teal-900);z-index:41;
  border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:#fff;height:57px;box-sizing:border-box;
}
.sidebar-brand img{width:26px;height:26px;border-radius:7px;object-fit:cover}

/* ===== Common components ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.page-title{font-family:'Kanit',sans-serif;font-size:20px;font-weight:600;margin:2px 0 14px 0;color:var(--teal-900)}
.row{display:flex;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.btn{border:none;border-radius:11px;padding:11px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-primary{background:var(--teal-700);color:#fff}
.btn-primary:disabled{background:#B9C9C6;color:#fff;cursor:not-allowed}
.btn-amber{background:var(--amber);color:var(--amber-ink)}
.btn-ghost{background:var(--teal-100);color:var(--teal-800,var(--teal-700))}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
label{font-size:13px;font-weight:600;color:var(--teal-900);display:block;margin:10px 0 5px}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=date],textarea,select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
}
textarea{resize:vertical;min-height:60px}
.req{color:var(--danger)}
.field-err{color:var(--danger);font-size:12px;margin-top:4px}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#D8D6CC;border-radius:20px;transition:.2s}
.slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--teal-600)}
.switch input:checked + .slider:before{transform:translateX(20px)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge.ok{background:var(--teal-100);color:var(--teal-700)}
.badge.off{background:#EFEEE7;color:var(--muted)}
.badge.warn{background:#FDF0DA;color:#8A5A0B}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
.divider{height:1px;background:var(--line);margin:12px 0}
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar input{flex:1}
.list-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--teal-100);flex-shrink:0}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--teal-600)}
.li-title{font-weight:600;font-size:14.5px}
.li-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.li-actions{display:flex;gap:6px;flex-shrink:0}
.upload-box{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13px;position:relative;cursor:pointer}
.upload-box img{max-width:100%;max-height:140px;border-radius:8px;margin-top:8px}
.upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,42,46,.45);display:none;align-items:flex-end;justify-content:center;z-index:200}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:18px 18px 0 0;max-width:520px;width:100%;max-height:92vh;overflow-y:auto;padding:18px;animation:slideup .18s ease-out}
@media(min-width:640px){.modal-bg{align-items:center}.modal{border-radius:18px}}
@keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal-head h3{margin:0;font-size:18px}
.close-x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1}

/* login */
#login-screen{height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--teal-900),var(--teal-700));padding:20px}
.login-card{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.login-card h1{text-align:center;color:var(--teal-900);font-size:22px;margin:6px 0 2px}
.login-card p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 18px}
.login-logo{width:56px;height:56px;background:var(--teal-100);border-radius:16px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--teal-700)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12.5px}
.tbl-wrap{overflow-x:auto}

/* sell grid */
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:520px){.prod-grid{grid-template-columns:repeat(3,1fr)}}
.prod-card{background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.prod-card .pimg{height:96px;background:var(--teal-100);display:flex;align-items:center;justify-content:center;color:var(--teal-600);font-size:26px;overflow:hidden}
.prod-card .pimg img{width:100%;height:100%;object-fit:cover}
.prod-card .pbody{padding:9px 10px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod-card .pname{font-weight:600;font-size:13.5px;line-height:1.25}
.prod-card .pdesc{font-size:11px;color:var(--muted);min-height:14px}
.prod-card .pprice{font-weight:700;color:var(--teal-700);font-size:14px}
.prod-card .pstock{font-size:11px;color:var(--muted)}
.prod-card.disabled{opacity:.45;pointer-events:none}
.qty-stepper{display:flex;align-items:center;justify-content:space-between;background:var(--teal-100);border-radius:9px;overflow:hidden}
.qty-stepper button{background:none;border:none;color:var(--teal-700);font-weight:700;width:30px;height:30px}
.qty-stepper .n{font-weight:700;font-size:13px}

.cart-fab{position:fixed;left:14px;right:14px;bottom:72px;background:var(--teal-700);color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(15,42,46,.3);z-index:40}
.cart-fab.show{display:flex}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px}
.stat .v{font-family:'Kanit',sans-serif;font-size:20px;font-weight:700;color:var(--teal-900)}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}

.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--teal-100);padding:4px;border-radius:11px}
.tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--teal-700);background:none;border:none}
.tab.active{background:#fff;box-shadow:var(--shadow)}

.receipt{background:#fff;padding:20px;border-radius:12px;font-size:13px;max-width:340px;margin:0 auto}
.receipt .rhead{text-align:center;margin-bottom:10px}
.receipt .rhead img{width:44px;height:44px;border-radius:10px;object-fit:cover;margin-bottom:6px}
.receipt .rhead h3{margin:2px 0;font-size:15px}
.receipt .rhead p{margin:1px 0;font-size:11.5px;color:var(--muted)}
.receipt table{font-size:12px}
.receipt .rtotal{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;z-index:400;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;bottom:100px}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perm-item{display:flex;align-items:center;gap:8px;background:var(--paper);padding:8px 10px;border-radius:9px;font-size:12.5px}
.check-alert{background:var(--danger-bg);border-radius:10px;padding:9px 12px;color:var(--danger);font-size:12.5px;margin-bottom:10px;display:none}
.check-alert.show{display:block}

/* ===== Interaction polish: hover / focus / active states ===== */
.btn{transition:filter .15s ease,transform .05s ease}
.btn:hover:not(:disabled){filter:brightness(0.96)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-outline:hover:not(:disabled){background:var(--paper)}
.list-item{transition:background-color .15s ease}
.prod-card{transition:box-shadow .15s ease,transform .1s ease}
.prod-card:not(.disabled):hover{box-shadow:0 6px 18px rgba(15,42,46,.14);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.upload-box:focus-within{
  outline:2px solid var(--teal-600);outline-offset:2px;
}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,input[type=tel]:focus,input[type=date]:focus,textarea:focus,select:focus{
  border-color:var(--teal-600);
}

/* ===== Print: receipt only ===== */
@media print{
  body *{visibility:hidden}
  #receipt-capture,#receipt-capture *{visibility:visible}
  #receipt-capture{position:absolute;left:0;top:0;width:100%;box-shadow:none;margin:0}
  .modal-bg{position:absolute;background:none}
  .modal{box-shadow:none;padding:0;max-height:none;overflow:visible}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏪</div>
    <h1 id="login-shopname">Todtingtermalatod</h1>
    <p class="sub">ระบบจัดการร้านค้า</p>
    <div id="login-connecting" style="text-align:center;padding:14px 0;color:var(--muted);font-size:13.5px">
      🔄 กำลังเชื่อมต่อฐานข้อมูลออนไลน์...
    </div>
    <div id="login-connect-err" class="field-err" style="display:none;text-align:center;margin-bottom:10px"></div>
    <div id="login-form-fields" style="display:none">
      <label>Username</label>
      <input type="text" id="login-user" placeholder="กรอก Username">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="กรอก Password">
      <div class="field-err" id="login-err" style="display:none"></div>
      <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="doLogin()">เข้าสู่ระบบ</button>
      <p class="hint" style="text-align:center;margin-top:16px">
        <a href="javascript:void(0)" onclick="openClearCacheModal()" style="color:var(--muted)">ล้างแคช / เริ่มต้นระบบใหม่</a>
      </p>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="sidebar-brand" id="sidebar-brand">🏪 <span id="sb-shopname">Todtingtermalatod</span></div>
  <div class="topbar">
    <div class="shopname" id="tb-shopname">🏪 Todtingtermalatod</div>
    <div class="row" style="align-items:center">
      <div class="user-chip" id="tb-user"></div>
      <button class="icon-btn" onclick="doLogout()" title="ออกจากระบบ">⏻</button>
    </div>
  </div>
  <div class="alert-strip" id="alert-strip"></div>
  <div id="main"></div>
  <div class="cart-fab" id="cart-fab" onclick="go('checkout')">
    <span id="cart-fab-text">ตะกร้า</span>
    <span class="btn btn-amber btn-sm" style="pointer-events:none">ชำระเงิน →</span>
  </div>
  <div class="bottomnav" id="bottomnav"></div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   Todtingtermalatod POS — single-file web app
   Data persistence: window.localStorage (key "posData")
   ========================================================================= */

const MENUS = [
  {key:'dashboard', label:'ภาพรวม', em:'📊'},
  {key:'sell',      label:'ขายสินค้า', em:'🛒'},
  {key:'products',  label:'สินค้า', em:'📦'},
  {key:'materials', label:'วัตถุดิบ', em:'🧺'},
  {key:'history',   label:'ประวัติขาย', em:'🧾'},
  {key:'profit',    label:'กำไร-ขาดทุน', em:'📈'},
  {key:'payments',  label:'ช่องทางชำระ', em:'💳'},
  {key:'shop',      label:'ข้อมูลร้าน', em:'🏬'},
  {key:'users',     label:'ผู้ใช้งาน', em:'👤'},
];

let DB = null;
let SESSION = null; // {userId, username, role}
let CART = {}; // productId -> qty
let CURRENT_ORDER = null; // pending order at checkout
let currentEditImg = {}; // temp holder for image data urls in open form
let CURRENT_PAGE = 'dashboard';
let DB_READY = false;

/* =========================================================================
   FIREBASE CONFIG
   ---------------------------------------------------------------------
   1) Go to https://console.firebase.google.com → Add project (free)
   2) In the project, click the "</>" (Web) icon to register a web app,
      and copy the firebaseConfig object it gives you into FIREBASE_CONFIG below.
   3) In the left menu: Build → Firestore Database → Create database
      (start in "test mode" is fine to begin with).
   4) In the left menu: Build → Authentication → Sign-in method → enable
      "Anonymous". This app signs everyone in anonymously in the background
      so Firestore Security Rules can require request.auth != null instead
      of being wide open to the entire internet.
   5) In Firestore → Rules, paste:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /pos/{docId} {
              allow read, write: if request.auth != null;
            }
          }
        }
      then click "Publish".
   See README.md for the full step-by-step walkthrough.
   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBUBFO7anEtbxLI0QxKkD2HzorzMRRTTs8",
  authDomain: "todtingtermalatod.firebaseapp.com",
  projectId: "todtingtermalatod",
  storageBucket: "todtingtermalatod.firebasestorage.app",
  messagingSenderId: "1060893171294",
  appId: "1:1060893171294:web:2592d9cbf6ec2e3a90decf"
};
let fdb = null; // Firestore instance (null until configured + connected)
const POS_DOC_PATH = ['pos','data']; // single shared document holding the whole shop's data

/* ---------------- persistence ---------------- */
function defaultRoles(){
  const all = MENUS.map(m=>m.key);
  return [
    {id:'role_superadmin', name:'Superadmin', permissions: all, isSystem:true,
      createdBy:'system', createdAt:Date.now(), updatedBy:'system', updatedAt:Date.now()},
    {id:'role_admin', name:'Admin', permissions: all, isSystem:false,
      createdBy:'system', createdAt:Date.now(), updatedBy:'system', updatedAt:Date.now()},
    {id:'role_manager', name:'ผู้จัดการ', permissions: all.filter(k=>k!=='users'), isSystem:false,
      createdBy:'system', createdAt:Date.now(), updatedBy:'system', updatedAt:Date.now()},
    {id:'role_staff', name:'พนักงานทั่วไป', permissions: ['sell','history'], isSystem:false,
      createdBy:'system', createdAt:Date.now(), updatedBy:'system', updatedAt:Date.now()}
  ];
}
function defaultDB(){
  return {
    shop:{name:'Todtingtermalatod', desc:'', address:'', phone:'', image:''},
    users:[{
      id:'u_admin', username:'Superadmin', password:'Superadmin', name:'Super Admin',
      phone:'', image:'', role:'Superadmin', permissions: MENUS.map(m=>m.key),
      active:true, createdBy:'system', createdAt:Date.now(), updatedBy:'system', updatedAt:Date.now()
    }],
    roles: defaultRoles(),
    materials:[],
    products:[],
    paymentMethods:[
      {id:'pm_cash', name:'เงินสด', desc:'ชำระด้วยเงินสด', icon:'', qrImage:'', cash:true, createdBy:'system', createdAt:Date.now(), updatedBy:'system', updatedAt:Date.now()}
    ],
    orders:[],
    activityLog:[],
    settings:{lineToken:''},
    seq:{product:0, material:0, order:0}
  };
}
/* Fills in any fields missing from data written by older versions of this
   app (works the same whether DB just arrived from Firestore or was freshly
   created) — keeps this idempotent so it's safe to call on every snapshot. */
function ensureDBDefaults(){
  if(!DB.settings) DB.settings = {lineToken:''};
  if(!DB.seq) DB.seq = {product:0, material:0, order:0};
  if(!DB.orders) DB.orders = [];
  if(!DB.activityLog) DB.activityLog = [];
  if(!DB.materials) DB.materials = [];
  if(!DB.products) DB.products = [];
  if(!DB.paymentMethods) DB.paymentMethods = [];
  if(!DB.users) DB.users = [];
  DB.orders.forEach(o=>{ if(!o.status) o.status = 'completed'; });
  if(!DB.roles || !DB.roles.length){
    DB.roles = defaultRoles();
    const usedNames = new Set(DB.users.map(u=>u.role));
    usedNames.forEach(n=>{
      if(n && !DB.roles.find(r=>r.name===n)){
        DB.roles.push({id:uid(), name:n, permissions: MENUS.map(m=>m.key), isSystem:false,
          createdBy:'system', createdAt:Date.now(), updatedBy:'system', updatedAt:Date.now()});
      }
    });
  }
}
function isFirebaseConfigured(){
  return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY';
}
/* Saves the whole shared DB object back to Firestore (or localStorage as a
   fallback if no Firebase config has been filled in yet, so the app still
   works standalone while you're setting things up). Fire-and-forget: the UI
   already re-renders from the in-memory DB immediately, this just persists
   it for other devices / next load. */
async function saveDB(){
  if(!isFirebaseConfigured() || !fdb){
    try{ localStorage.setItem('posData', JSON.stringify(DB)); }catch(e){}
    return;
  }
  try{
    await fdb.collection(POS_DOC_PATH[0]).doc(POS_DOC_PATH[1]).set(DB);
  }catch(e){
    console.error('Firestore save error', e);
    toast('บันทึกข้อมูลขึ้นระบบออนไลน์ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)');
  }
}
/* Boots the app: connects to Firestore (with anonymous auth) and keeps DB in
   sync in real time across every device that has this page open. Falls back
   to plain localStorage (single device only) if Firebase isn't configured. */
function bootData(onReady){
  if(!isFirebaseConfigured()){
    try{
      const raw = localStorage.getItem('posData');
      DB = raw ? JSON.parse(raw) : defaultDB();
    }catch(e){ DB = defaultDB(); }
    ensureDBDefaults();
    DB_READY = true;
    onReady();
    return;
  }
  try{
    const app = firebase.initializeApp(FIREBASE_CONFIG);
    fdb = firebase.firestore();
    firebase.auth().signInAnonymously().catch(err=>{
      console.error('Firebase anonymous auth error', err);
      showLoginConnectError('เชื่อมต่อระบบยืนยันตัวตนไม่สำเร็จ ตรวจสอบว่าเปิดใช้งาน Anonymous sign-in ใน Firebase Authentication แล้ว');
    });
    firebase.auth().onAuthStateChanged(user=>{
      if(!user) return;
      const docRef = fdb.collection(POS_DOC_PATH[0]).doc(POS_DOC_PATH[1]);
      docRef.onSnapshot(async snap=>{
        if(snap.exists){
          DB = snap.data();
        } else {
          DB = defaultDB();
          try{ await docRef.set(DB); }catch(e){ console.error(e); }
        }
        ensureDBDefaults();
        const firstLoad = !DB_READY;
        DB_READY = true;
        onReady(firstLoad);
      }, err=>{
        console.error('Firestore snapshot error', err);
        showLoginConnectError('เชื่อมต่อฐานข้อมูลออนไลน์ไม่สำเร็จ ตรวจสอบ Firestore Rules และการตั้งค่า Firebase config');
      });
    });
  }catch(e){
    console.error('Firebase init error', e);
    showLoginConnectError('ตั้งค่า Firebase ไม่ถูกต้อง กรุณาตรวจสอบ FIREBASE_CONFIG ในไฟล์โค้ด');
  }
}

  const el = document.getElementById('login-connect-err');

  const c = document.getElementById('login-connecting');

}

function money(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtTime(ts){ const d=new Date(ts); return d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateTime(ts){ return fmtDate(ts)+' '+fmtTime(ts); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function calcProductCost(product){
  return (product.materials||[]).reduce((sum,mu)=>{

}

function readImage(input, cb){
  const f = input.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=> cb(reader.result);
  reader.readAsDataURL(f);
}
/* Resizes/compresses an uploaded image before it's stored. Important once
   data lives in Firestore: each document has a 1MiB limit, and this whole
   shop's data shares one document, so keeping images small (~640px, JPEG)
   matters a lot more than it did with plain localStorage. */
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('อ่านไฟล์ภาพไม่สำเร็จ'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.readAsDataURL(file);
  });
}
/* Reusable image upload box: avoids fragile inline-string HTML tricks so the
   preview always renders correctly right after a file is chosen. */
function uploadBoxHTML(boxId, key, currentValue, placeholder){
  return `<div class="upload-box" id="${boxId}">
      <input type="file" accept="image/*" onchange="handleImageUpload(this,'${key}','${boxId}',${JSON.stringify(placeholder)})">
      ${currentValue ? `<img src="${currentValue}">` : esc(placeholder)}
    </div>`;
}
function handleImageUpload(input, key, boxId, placeholder){
  const f = input.files[0]; if(!f) return;
  compressImageFile(f, 640, 0.72).then(dataUrl=>{
    currentEditImg[key] = dataUrl;
    document.getElementById(boxId).outerHTML = uploadBoxHTML(boxId, key, dataUrl, placeholder);
  }).catch(()=>{ toast('ไม่สามารถประมวลผลรูปภาพนี้ได้ ลองใช้รูปอื่น'); });
}

  const soon = DB.materials.filter(m=>{
    if(!m.expiryDate) return false;
    const days = (new Date(m.expiryDate) - new Date())/86400000;
    return days <= 1 && days >= -365;
  });
  if(soon.length) msgs.push(`⏰ วัตถุดิบใกล้หมดอายุ ${soon.length} รายการ`);
  if(msgs.length){ strip.textContent = msgs.join('   |   '); strip.classList.add('show'); }

}

function renderDashboard(){

        <button class="tab active" id="dtab-day" onclick="setDashRange('day')">รายวัน</button>
        <button class="tab" id="dtab-week" onclick="setDashRange('week')">รายสัปดาห์</button>

      </div>
      <div id="dash-custom-range" style="display:none" class="row wrap">
        <div class="grow"><label>วันที่เริ่มต้น</label><input type="date" id="dash-start"></div>
        <div class="grow"><label>วันที่สิ้นสุด</label><input type="date" id="dash-end"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn btn-primary btn-sm" onclick="runDashboard()">ดูข้อมูล (ย้อนหลังได้สูงสุด 30 วัน)</button>
      </div>
      <div class="divider"></div>
      <div id="dash-result"></div>
    </div>`;
  window._dashRange = 'day';
  runDashboard();
}
function setDashRange(r){
  window._dashRange = r;
  ['day','week','month','custom'].forEach(k=>document.getElementById('dtab-'+k).classList.toggle('active', k===r));
  document.getElementById('dash-custom-range').style.display = r==='custom' ? 'flex' : 'none';
}
function runDashboard(){
  const r = window._dashRange || 'day';
  let start, end = Date.now();
  const now = new Date(); now.setHours(0,0,0,0);
  if(r==='day') start = now.getTime();
  else if(r==='week') start = now.getTime() - 6*86400000;
  else if(r==='month') start = now.getTime() - 29*86400000;
  else {
    const s = document.getElementById('dash-start').value, e = document.getElementById('dash-end').value;
    if(!s || !e){ toast('กรุณาเลือกวันที่เริ่มต้นและสิ้นสุด'); return; }
    start = new Date(s).setHours(0,0,0,0);
    end = new Date(e).setHours(23,59,59,999);
    if((end-start) > 30*86400000 + 86400000){ toast('เลือกช่วงเวลาได้ไม่เกิน 30 วัน'); return; }
  }
  const orders = activeOrders().filter(o=>o.timestamp>=start && o.timestamp<=end);
  const revenue = orders.reduce((s,o)=>s+o.total,0);
  const byProduct = {};
  orders.forEach(o=>o.items.forEach(it=>{
    byProduct[it.name] = byProduct[it.name] || {qty:0, revenue:0};
    byProduct[it.name].qty += it.qty; byProduct[it.name].revenue += it.qty*it.price;
  }));
  const byUser = {};
  orders.forEach(o=>{ byUser[o.cashier] = (byUser[o.cashier]||0) + o.total; });

  const rows = Object.entries(byProduct).map(([name,v])=>`<tr><td>${esc(name)}</td><td>${v.qty}</td><td>${money(v.revenue)}</td></tr>`).join('');
  const userRows = Object.entries(byUser).map(([u,v])=>`<tr><td>${esc(u)}</td><td>${money(v)}</td></tr>`).join('');

  document.getElementById('dash-result').innerHTML = `
    <div class="row wrap" style="gap:14px;margin-bottom:10px">
      <div><b>${orders.length}</b> ออเดอร์</div><div><b>${money(revenue)}</b> บาท</div>
    </div>
    <b style="font-size:13px">ขายตามสินค้า</b>
    <div class="tbl-wrap"><table><tr><th>สินค้า</th><th>จำนวน</th><th>ยอดขาย</th></tr>${rows || '<tr><td colspan=3 class="empty">ไม่มีข้อมูล</td></tr>'}</table></div>
    <div class="divider"></div>
    <b style="font-size:13px">ขายตามผู้ใช้งาน</b>
    <div class="tbl-wrap"><table><tr><th>ผู้ขาย</th><th>ยอดขาย</th></tr>${userRows || '<tr><td colspan=2 class="empty">ไม่มีข้อมูล</td></tr>'}</table></div>
  `;
  window._dashOrders = orders;
}
function exportExcel(){
  const orders = window._dashOrders && window._dashOrders.length ? window._dashOrders : activeOrders();
  if(!orders.length){ toast('ไม่มีข้อมูลสำหรับ Export'); return; }
  const rows = [];
  orders.forEach(o=>{
    o.items.forEach(it=>{
      rows.push({
        'เลขที่ Order': o.orderNo, 'วันที่': fmtDate(o.timestamp), 'เวลา': fmtTime(o.timestamp),
        'สินค้า': it.name, 'จำนวน': it.qty, 'ราคาต่อหน่วย': it.price, 'รวม': it.qty*it.price,
        'วิธีชำระเงิน': o.paymentMethodName, 'รับเงิน': o.received||'', 'เงินทอน': o.change||'',
        'ผู้คิดเงิน': o.cashier
      });
    });
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ยอดขาย');
  XLSX.writeFile(wb, `sales_export_${Date.now()}.xlsx`);
  logActivity('Export Excel', `ส่งออกข้อมูลยอดขาย ${orders.length} ออเดอร์`);
}

  `);
  updateCostEstimate();

function updateCostEstimate(){
  const box = document.getElementById('cost-estimate-box');
  if(!box) return;
  let cost = 0;
  document.querySelectorAll('[data-mat]').forEach(cb=>{
    if(cb.checked){
      const qtyInput = document.getElementById('matqty-'+cb.dataset.mat);
      const mat = DB.materials.find(m=>m.id===cb.dataset.mat);
      if(mat && qtyInput) cost += Number(mat.costPerUnit||0) * (Number(qtyInput.value)||0);
    }
  });
  const price = Number(document.getElementById('pf-price')?.value)||0;
  const profit = price - cost;
  const margin = price>0 ? (profit/price*100) : 0;
  box.innerHTML = `
    <div class="row wrap" style="justify-content:space-between;font-size:13px">
      <span>ต้นทุนรวม/ชิ้น: <b>฿${money(cost)}</b></span>
      <span>กำไร/ชิ้น: <b style="color:${profit>=0?'var(--teal-700)':'var(--danger)'}">฿${money(profit)}</b></span>
      <span>อัตรากำไร: <b>${margin.toFixed(1)}%</b></span>
    </div>`;
}
function deleteProduct(id){
  if(!confirm('ยืนยันการลบสินค้านี้?')) return;
  const p = DB.products.find(x=>x.id===id);
  DB.products = DB.products.filter(x=>x.id!==id);
  logActivity('ลบสินค้า', `ลบสินค้า ${p.name} (${id})`);
  saveDB(); renderProductList();
}
function saveProduct(id){
  const name = document.getElementById('pf-name').value.trim();
  const qty = document.getElementById('pf-qty').value;
  const price = document.getElementById('pf-price').value;
  if(!name){ toast('กรุณากรอกชื่อสินค้า'); return; }
  if(qty==='' || Number(qty)<0){ toast('กรุณากรอกจำนวนให้ถูกต้อง'); return; }
  if(price==='' || Number(price)<0){ toast('กรุณากรอกราคาให้ถูกต้อง'); return; }
  const materials = [];
  document.querySelectorAll('[data-mat]').forEach(cb=>{
    if(cb.checked){
      const q = Number(document.getElementById('matqty-'+cb.dataset.mat).value)||0;
      materials.push({materialId:cb.dataset.mat, qty:q});
    }
  });
  const now = Date.now();
  if(id){
    const p = DB.products.find(x=>x.id===id);
    p.name=name; p.desc=document.getElementById('pf-desc').value.trim(); p.price=Number(price);
    p.qty=Number(qty); p.active=document.getElementById('pf-active').checked;
    p.image=currentEditImg.product||p.image||''; p.materials=materials;
    p.updatedBy=SESSION.username; p.updatedAt=now;
    logActivity('แก้ไขสินค้า', `แก้ไขสินค้า ${p.name} (${id})`);
  } else {
    const code = nextCode('P', 'product');
    DB.products.push({
      id:code, name, desc:document.getElementById('pf-desc').value.trim(), price:Number(price),
      qty:Number(qty), initialQty:Number(qty), active:document.getElementById('pf-active').checked,
      image:currentEditImg.product||'', materials,
      createdBy:SESSION.username, createdAt:now, updatedBy:SESSION.username, updatedAt:now
    });
    logActivity('เพิ่มสินค้า', `เพิ่มสินค้า ${name} (${code})`);
  }
  saveDB(); closeModal(); renderProductList();
}

    const m = DB.materials.find(x=>x.id===id);
    m.name=name; m.category=document.getElementById('mf-cat').value.trim(); m.unit=document.getElementById('mf-unit').value;
    m.qty=Number(document.getElementById('mf-qty').value)||0; m.minQty=Number(document.getElementById('mf-min').value)||0;
    m.receivedDate=document.getElementById('mf-received').value; m.expiryDate=document.getElementById('mf-expiry').value;
    m.costPerUnit=Number(document.getElementById('mf-cost').value)||0;

    logActivity('แก้ไขวัตถุดิบ', `แก้ไขวัตถุดิบ ${m.name}`);
  } else {
    const sku = nextCode('MAT', 'material');
    DB.materials.push({
      id:uid(), sku, name, category:document.getElementById('mf-cat').value.trim(), unit:document.getElementById('mf-unit').value,
      qty:Number(document.getElementById('mf-qty').value)||0, minQty:Number(document.getElementById('mf-min').value)||0,
      receivedDate:document.getElementById('mf-received').value, expiryDate:document.getElementById('mf-expiry').value,
      costPerUnit:Number(document.getElementById('mf-cost').value)||0, log:[],
      createdBy:SESSION.username, createdAt:now, updatedBy:SESSION.username, updatedAt:now
    });

  }
  saveDB(); closeModal(); renderMaterials();
}
function deleteMaterial(id){
  const usedBy = DB.products.filter(p=>(p.materials||[]).some(mu=>mu.materialId===id));
  if(usedBy.length){ toast(`ไม่สามารถลบได้ วัตถุดิบนี้ถูกใช้ในสินค้า ${usedBy.length} รายการ`); return; }
  if(!confirm('ยืนยันการลบวัตถุดิบนี้?')) return;
  const m = DB.materials.find(x=>x.id===id);
  DB.materials = DB.materials.filter(x=>x.id!==id);
  logActivity('ลบวัตถุดิบ', `ลบวัตถุดิบ ${m.name}`);
  saveDB(); renderMaterials();
}
function openStockMove(id){
  const m = DB.materials.find(x=>x.id===id);
  openModal(`
    <div class="modal-head"><h3>รับเข้า/จ่ายออก: ${esc(m.name)}</h3><button class="close-x" onclick="closeModal()">✕</button></div>

    <label>ประเภทรายการ</label>
    <select id="sm-type"><option value="in">รับเข้า</option><option value="out">จ่ายออก</option></select>
    <label>จำนวน <span class="req">*</span></label>
    <input type="number" min="0.01" step="0.01" id="sm-qty">
    <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="saveStockMove('${id}')">บันทึก</button>
  `);
}
function saveStockMove(id){
  const type = document.getElementById('sm-type').value;
  const qty = Number(document.getElementById('sm-qty').value);
  if(!qty || qty<=0){ toast('กรุณากรอกจำนวนให้ถูกต้อง'); return; }
  const m = DB.materials.find(x=>x.id===id);
  if(type==='out' && qty > m.qty){ toast('จำนวนจ่ายออกมากกว่าคงเหลือ'); return; }
  m.qty = type==='in' ? m.qty+qty : m.qty-qty;
  m.log = m.log || [];
  m.log.push({time:Date.now(), type, qty, user:SESSION.username});
  logActivity(type==='in'?'รับเข้าวัตถุดิบ':'จ่ายออกวัตถุดิบ', `${m.name} จำนวน ${qty} ${m.unit}`);
  saveDB(); closeModal(); renderMaterials();
}

   SELL (product selection / cart)
   ========================================================================= */
function cartCount(){ return Object.values(CART).reduce((s,q)=>s+q,0); }
function cartTotal(){ return Object.entries(CART).reduce((s,[pid,q])=>{ const p=DB.products.find(x=>x.id===pid); return s + (p?p.price*q:0); },0); }
function renderSell(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-title">🛒 เลือกซื้อสินค้า</div>
    <div class="searchbar"><input type="text" id="sell-search" placeholder="ค้นหาสินค้า..." oninput="renderSellGrid()"></div>
    <div class="prod-grid" id="sell-grid"></div>`;
  renderSellGrid();
  updateCartFab();
}
function renderSellGrid(){
  const q = (document.getElementById('sell-search').value||'').toLowerCase();
  const items = DB.products.filter(p=>p.active && p.name.toLowerCase().includes(q));
  document.getElementById('sell-grid').innerHTML = items.length ? items.map(p=>{
    const out = p.qty<=0;
    const inCart = CART[p.id]||0;
    return `<div class="prod-card ${out?'disabled':''}">
      <div class="pimg">${p.image?`<img src="${p.image}">`:'📦'}</div>
      <div class="pbody">
        <div class="pname">${esc(p.name)}</div>
        <div class="pdesc">${esc(p.desc||'')}</div>
        <div class="pprice">฿${money(p.price)}</div>
        <div class="pstock">${out?'สินค้าหมด':'คงเหลือ '+p.qty}</div>
        ${inCart>0 ? `
          <div class="qty-stepper">
            <button onclick="changeCart('${p.id}',-1)">–</button>
            <span class="n">${inCart}</span>
            <button onclick="changeCart('${p.id}',1)">+</button>
          </div>` : `<button class="btn btn-ghost btn-sm" onclick="changeCart('${p.id}',1)">+ ใส่ตะกร้า</button>`}
      </div>
    </div>`;
  }).join('') : `<div class="empty" style="grid-column:1/-1">ไม่พบสินค้า</div>`;
}
function changeCart(pid, delta){
  const p = DB.products.find(x=>x.id===pid);
  const cur = CART[pid]||0;
  const next = cur + delta;
  if(next<=0){ delete CART[pid]; }
  else if(next > p.qty){ toast('จำนวนเกินสต็อกคงเหลือ'); return; }
  else CART[pid] = next;
  renderSellGrid(); updateCartFab();
}
function updateCartFab(){
  const fab = document.getElementById('cart-fab');
  const n = cartCount();
  fab.classList.toggle('show', n>0);
  document.getElementById('cart-fab-text').textContent = `${n} รายการ · ฿${money(cartTotal())}`;
}

}
function selectPM(pmId){
  document.getElementById('pmr-'+pmId).checked = true;
  const pm = DB.paymentMethods.find(x=>x.id===pmId);
  const total = window._checkoutTotal;
  const isCash = pm.cash;
  document.getElementById('pm-detail').style.display='block';
  document.getElementById('pm-detail').innerHTML = `
    <b>รายละเอียดการชำระเงิน — ${esc(pm.name)}</b>
    ${pm.qrImage?`<div style="text-align:center;margin-top:10px"><img src="${pm.qrImage}" style="max-width:180px;border-radius:10px"></div>`:''}
    ${isCash ? `
      <label>รับเงิน (บาท) <span class="req">*</span></label>
      <input type="number" min="0" step="0.01" id="co-received" oninput="calcChange()">
      <div class="field-err" id="co-received-err" style="display:none"></div>
      <div class="row" style="justify-content:space-between;margin-top:10px;font-weight:600">
        <span>เงินทอน</span><span id="co-change">฿0.00</span>
      </div>
    ` : `<div class="hint" style="margin-top:8px">ยอดชำระ ฿${money(total)} — ยืนยันเมื่อได้รับการชำระเงินแล้ว</div>`}
    <div class="check-alert" id="co-alert"></div>
    <button class="btn btn-primary btn-block" style="margin-top:14px" id="co-confirm-btn" onclick="confirmPayment('${pmId}')" ${isCash?'disabled':''}>ชำระเงินสำเร็จ</button>
  `;
  window._isCash = isCash;
}
function calcChange(){
  const total = window._checkoutTotal;
  const raw = document.getElementById('co-received').value;
  const btn = document.getElementById('co-confirm-btn');
  const alertBox = document.getElementById('co-alert');
  const errBox = document.getElementById('co-received-err');
  const received = Number(raw);
  errBox.style.display='none'; alertBox.classList.remove('show');
  if(raw==='' || isNaN(received) || received<=0){
    document.getElementById('co-change').textContent = '฿0.00';
    btn.disabled = true; return;
  }
  if(received < total){
    alertBox.textContent = 'จำนวนเงินที่รับน้อยกว่ายอดรวมทั้งหมด กรุณากรอกใหม่';
    alertBox.classList.add('show');
    btn.disabled = true;
    document.getElementById('co-change').textContent = '฿0.00';
    return;
  }
  document.getElementById('co-change').textContent = '฿'+money(received-total);
  btn.disabled = false;
}
function confirmPayment(pmId){
  const pm = DB.paymentMethods.find(x=>x.id===pmId);
  const total = window._checkoutTotal;
  let received = null, change = null;
  if(pm.cash){
    received = Number(document.getElementById('co-received').value);
    if(!received || received<total){ toast('กรุณากรอกจำนวนเงินที่รับให้ถูกต้อง'); return; }
    change = received - total;
  }
  const items = window._checkoutItems.map(({p,q})=>({productId:p.id, name:p.name, qty:q, price:p.price}));
  // deduct stock
  window._checkoutItems.forEach(({p,q})=>{
    p.qty -= q;
    // deduct materials used
    (p.materials||[]).forEach(mu=>{
      const mat = DB.materials.find(x=>x.id===mu.materialId);
      if(mat){ mat.qty = Math.max(0, mat.qty - mu.qty*q); mat.log=mat.log||[]; mat.log.push({time:Date.now(),type:'out',qty:mu.qty*q,user:SESSION.username}); }
    });
  });
  const orderNo = nextCode('ORD', 'order');
  const order = {
    id: uid(), orderNo, timestamp: Date.now(), items, total,
    paymentMethodId: pmId, paymentMethodName: pm.name, isCash: !!pm.cash,
    received, change, cashier: SESSION.username, status:'completed'
  };
  DB.orders.unshift(order);
  logActivity('ชำระเงินสำเร็จ', `Order ${orderNo} ยอดรวม ฿${money(total)} โดย ${SESSION.username}`);
  saveDB();
  sendLineNotify(order);
  CART = {};
  showReceipt(order, true);
}

/* LINE Notify (best-effort — browsers block cross-origin POST to notify-api.line.me
   without a server-side proxy due to CORS. Code included for when hosted behind a proxy
   or run via server-side automation.) */
function sendLineNotify(order){
  const token = DB.settings.lineToken;
  if(!token) return;
  const msg = `\nOrder ${order.orderNo} ชำระเงินสำเร็จ\nยอดรวม ฿${money(order.total)}\nวิธีชำระ: ${order.paymentMethodName}\nผู้คิดเงิน: ${order.cashier}`;

    method:'POST',

    body:'message='+encodeURIComponent(msg)
  }).catch(()=>{ console.warn('LINE Notify ส่งไม่สำเร็จ (อาจติด CORS — ต้องใช้ Proxy ฝั่งเซิร์ฟเวอร์)'); });
}

function confirmCancelOrder(orderId){
  const reason = document.getElementById('cancel-reason').value.trim();
  if(!reason){ document.getElementById('cancel-reason-err').style.display='block'; return; }
  const o = DB.orders.find(x=>x.id===orderId);
  if(!o || o.status==='cancelled') { closeModal(); return; }
  if(!confirm(`ยืนยันยกเลิก Order ${o.orderNo} ยอด ฿${money(o.total)}? การกระทำนี้จะคืนสต็อกสินค้าและวัตถุดิบกลับเข้าคลัง`)) return;

  // restore product stock
  o.items.forEach(it=>{
    const p = DB.products.find(x=>x.id===it.productId);
    if(p){
      p.qty += it.qty;
      // restore materials used by this product's recipe
      (p.materials||[]).forEach(mu=>{
        const mat = DB.materials.find(x=>x.id===mu.materialId);
        if(mat){
          mat.qty += mu.qty*it.qty;
          mat.log = mat.log||[];
          mat.log.push({time:Date.now(), type:'in', qty:mu.qty*it.qty, user:SESSION.username, note:`คืนสต็อกจากการยกเลิก Order ${o.orderNo}`});
        }
      });
    }
  });

  o.cancelledBy = SESSION.username;
  o.cancelledAt = Date.now();
  o.cancelReason = reason;
  logActivity('ยกเลิก Order', `ยกเลิก Order ${o.orderNo} ยอด ฿${money(o.total)} เหตุผล: ${reason}`);
  saveDB();
  sendLineNotifyCancel(o);
  closeModal();
  renderHistoryList();
  toast('ยกเลิก Order และคืนสต็อกเรียบร้อยแล้ว');
}

function renderProfit(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-title">📈 กำไร-ขาดทุน</div>
    <div class="card">
      <div class="tabs">
        <button class="tab active" id="ptab-day" onclick="setProfitRange('day')">รายวัน</button>
        <button class="tab" id="ptab-week" onclick="setProfitRange('week')">รายสัปดาห์</button>
        <button class="tab" id="ptab-month" onclick="setProfitRange('month')">รายเดือน</button>
        <button class="tab" id="ptab-custom" onclick="setProfitRange('custom')">กำหนดเอง</button>
      </div>
      <div id="profit-custom-range" style="display:none" class="row wrap">
        <div class="grow"><label>วันที่เริ่มต้น</label><input type="date" id="profit-start"></div>

      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn btn-primary btn-sm" onclick="runProfit()">คำนวณกำไร-ขาดทุน</button>
        <button class="btn btn-outline btn-sm" onclick="exportProfitExcel()">⬇️ Export Excel</button>
      </div>
    </div>
    <div id="profit-result"></div>
    <div class="card">
      <p class="hint">💡 ต้นทุนคำนวณจาก "ต้นทุนวัตถุดิบต่อหน่วย" ที่ตั้งค่าไว้ล่าสุดของสินค้าแต่ละรายการ (เมนู "สินค้า") หากมีการเปลี่ยนแปลงต้นทุนวัตถุดิบภายหลัง ตัวเลขในรายงานย้อนหลังจะคำนวณด้วยต้นทุนปัจจุบัน ไม่ใช่ต้นทุน ณ วันที่ขายจริง</p>
    </div>`;
  window._profitRange = 'day';
  runProfit();
}
function setProfitRange(r){
  window._profitRange = r;
  ['day','week','month','custom'].forEach(k=>document.getElementById('ptab-'+k).classList.toggle('active', k===r));
  document.getElementById('profit-custom-range').style.display = r==='custom' ? 'flex' : 'none';
}
function getProfitRangeBounds(){
  const r = window._profitRange || 'day';
  let start, end = Date.now();
  const now = new Date(); now.setHours(0,0,0,0);
  if(r==='day') start = now.getTime();
  else if(r==='week') start = now.getTime() - 6*86400000;
  else if(r==='month') start = now.getTime() - 29*86400000;
  else {
    const s = document.getElementById('profit-start').value, e = document.getElementById('profit-end').value;
    if(!s || !e) return null;
    start = new Date(s).setHours(0,0,0,0);
    end = new Date(e).setHours(23,59,59,999);
  }
  return {start, end};
}
function computeProfitData(){
  const bounds = getProfitRangeBounds();
  if(!bounds){ toast('กรุณาเลือกวันที่เริ่มต้นและสิ้นสุด'); return null; }
  const orders = activeOrders().filter(o=>o.timestamp>=bounds.start && o.timestamp<=bounds.end);
  const byProduct = {};
  orders.forEach(o=>o.items.forEach(it=>{
    const product = DB.products.find(p=>p.id===it.productId);
    const unitCost = product ? calcProductCost(product) : 0;
    const key = it.productId;
    if(!byProduct[key]) byProduct[key] = {name:it.name, qty:0, revenue:0, cost:0, missing: !product};
    byProduct[key].qty += it.qty;
    byProduct[key].revenue += it.qty*it.price;
    byProduct[key].cost += it.qty*unitCost;
  }));
  const rows = Object.values(byProduct).map(r=>({...r, profit: r.revenue-r.cost, margin: r.revenue>0 ? (r.revenue-r.cost)/r.revenue*100 : 0}))
    .sort((a,b)=>b.profit-a.profit);
  const totalRevenue = rows.reduce((s,r)=>s+r.revenue,0);
  const totalCost = rows.reduce((s,r)=>s+r.cost,0);
  const totalProfit = totalRevenue-totalCost;
  const totalMargin = totalRevenue>0 ? totalProfit/totalRevenue*100 : 0;
  return {rows, totalRevenue, totalCost, totalProfit, totalMargin, orderCount:orders.length};
}
function runProfit(){
  const data = computeProfitData();
  if(!data) return;
  window._profitData = data;
  const maxProfit = Math.max(1, ...data.rows.map(r=>Math.abs(r.profit)));
  const bars = data.rows.slice(0,8).map(r=>`
    <div style="margin-bottom:8px">
      <div class="row" style="justify-content:space-between;font-size:12.5px;margin-bottom:3px">
        <span>${esc(r.name)}${r.missing?' <span class="badge warn">ไม่พบสินค้า</span>':''}</span>
        <span style="font-weight:700;color:${r.profit>=0?'var(--teal-700)':'var(--danger)'}">฿${money(r.profit)}</span>
      </div>
      <div style="background:var(--paper);border-radius:8px;height:10px;overflow:hidden">
        <div style="height:100%;width:${Math.max(2,Math.abs(r.profit)/maxProfit*100)}%;background:${r.profit>=0?'var(--teal-600)':'var(--danger)'};border-radius:8px"></div>
      </div>
    </div>`).join('') || '<div class="empty">ไม่มีข้อมูลในช่วงเวลานี้</div>';

  const rows = data.rows.map(r=>`
    <tr>
      <td>${esc(r.name)}${r.missing?' <span class="badge warn">ไม่พบสินค้า</span>':''}</td>
      <td>${r.qty}</td>
      <td>฿${money(r.revenue)}</td>
      <td>฿${money(r.cost)}</td>
      <td style="color:${r.profit>=0?'var(--teal-700)':'var(--danger)'};font-weight:600">฿${money(r.profit)}</td>
      <td>${r.margin.toFixed(1)}%</td>
    </tr>`).join('');

  document.getElementById('profit-result').innerHTML = `

function exportProfitExcel(){
  const data = window._profitData;
  if(!data || !data.rows.length){ toast('ไม่มีข้อมูลสำหรับ Export'); return; }
  const rows = data.rows.map(r=>({
    'สินค้า': r.name, 'จำนวนขาย': r.qty, 'รายได้': r.revenue, 'ต้นทุน': r.cost,
    'กำไร': r.profit, '%กำไร': Number(r.margin.toFixed(2))
  }));
  rows.push({'สินค้า':'รวมทั้งหมด','จำนวนขาย':'', 'รายได้':data.totalRevenue, 'ต้นทุน':data.totalCost, 'กำไร':data.totalProfit, '%กำไร':Number(data.totalMargin.toFixed(2))});
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'กำไร-ขาดทุน');
  XLSX.writeFile(wb, `profit_loss_${Date.now()}.xlsx`);
  logActivity('Export Excel', `ส่งออกข้อมูลกำไร-ขาดทุน`);
}

function saveRole(id){
  const name = document.getElementById('rf-name').value.trim();
  if(!name){ toast('กรุณากรอกชื่อ Role'); return; }
  const dup = DB.roles.find(x=>x.name===name && x.id!==id);
  if(dup){ toast('มีชื่อ Role นี้อยู่แล้ว'); return; }
  const perms = Array.from(document.querySelectorAll('[data-rperm]')).filter(c=>c.checked).map(c=>c.dataset.rperm);
  const now = Date.now();
  if(id){
    const r = DB.roles.find(x=>x.id===id);
    const oldName = r.name;
    r.name = name; r.permissions = perms; r.updatedBy=SESSION.username; r.updatedAt=now;
    if(oldName!==name){
      DB.users.forEach(u=>{ if(u.role===oldName) u.role = name; });
      if(SESSION.role===oldName) SESSION.role = name;
    }
    logActivity('แก้ไข Role', `แก้ไข Role ${name}`);
  } else {
    DB.roles.push({id:uid(), name, permissions:perms, isSystem:false, createdBy:SESSION.username, createdAt:now, updatedBy:SESSION.username, updatedAt:now});
    logActivity('เพิ่ม Role', `เพิ่ม Role ${name}`);
  }
  saveDB(); closeModal(); renderRoleList();
}
function deleteRole(id){
  const r = DB.roles.find(x=>x.id===id);
  if(r.isSystem){ toast('ไม่สามารถลบ Role ระบบได้'); return; }
  const inUse = DB.users.filter(u=>u.role===r.name).length;
  if(inUse>0){ toast(`ไม่สามารถลบได้ เนื่องจากมีผู้ใช้งาน ${inUse} คนใช้ Role นี้อยู่`); return; }
  if(!confirm('ยืนยันการลบ Role นี้?')) return;
  DB.roles = DB.roles.filter(x=>x.id!==id);
  logActivity('ลบ Role', `ลบ Role ${r.name}`);
  saveDB(); renderRoleList();
}
function applyRoleDefaults(){
  const roleName = document.getElementById('uf-role').value;
  const role = DB.roles.find(r=>r.name===roleName);
  if(!role) return;
  document.querySelectorAll('[data-perm]').forEach(cb=>{ cb.checked = role.permissions.includes(cb.dataset.perm); });
  toast('โหลดสิทธิ์เริ่มต้นจาก Role แล้ว');
}

      <button type="button" class="btn btn-ghost btn-sm" onclick="applyRoleDefaults()">โหลดสิทธิ์เริ่มต้น</button>
    </div>
    <div class="hint">ไม่พบ Role ที่ต้องการ? ไปที่แท็บ "🔑 จัดการ Role" เพื่อเพิ่ม Role ใหม่ได้</div>
    <label>สิทธิ์การมองเห็นเมนู (Permission)</label>
    <div class="perm-grid">
      ${MENUS.map(m=>`<label class="perm-item"><input type="checkbox" data-perm="${m.key}" ${perms.includes(m.key)?'checked':''}> ${m.em} ${m.label}</label>`).join('')}
    </div>
    <label style="display:flex;align-items:center;gap:10px;margin-top:14px">
      <label class="switch"><input type="checkbox" id="uf-active" ${(!u||u.active)?'checked':''}><span class="slider"></span></label>
      เปิดใช้งานบัญชีนี้
    </label>
    <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="saveUser(${u?`'${u.id}'`:'null'})">บันทึก</button>
  `);
}
function saveUser(id){
  const username = document.getElementById('uf-username').value.trim();
  const password = document.getElementById('uf-password').value;
  const name = document.getElementById('uf-name').value.trim();
  const phone = document.getElementById('uf-phone').value.trim();
  if(!username||!password||!name||!phone){ toast('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }
  if(!/^\d{10}$/.test(phone)){ toast('เบอร์โทรต้องเป็นตัวเลข 10 หลัก'); return; }
  const dup = DB.users.find(x=>x.username===username && x.id!==id);
  if(dup){ toast('Username นี้ถูกใช้งานแล้ว'); return; }
  const perms = Array.from(document.querySelectorAll('[data-perm]')).filter(c=>c.checked).map(c=>c.dataset.perm);
  const now = Date.now();
  if(id){
    const u = DB.users.find(x=>x.id===id);
    u.username=username; u.password=password; u.name=name; u.phone=phone;
    u.image=currentEditImg.user||u.image||''; u.role=document.getElementById('uf-role').value;
    u.permissions=perms; u.active=document.getElementById('uf-active').checked;
    u.updatedBy=SESSION.username; u.updatedAt=now;
    logActivity('แก้ไขผู้ใช้งาน', `แก้ไขผู้ใช้งาน ${username}`);
    if(SESSION.userId===id){ SESSION.permissions=perms; SESSION.role=u.role; renderNav(); }
  } else {
    DB.users.push({id:uid(), username, password, name, phone, image:currentEditImg.user||'', role:document.getElementById('uf-role').value, permissions:perms, active:document.getElementById('uf-active').checked, createdBy:SESSION.username, createdAt:now, updatedBy:SESSION.username, updatedAt:now});
    logActivity('เพิ่มผู้ใช้งาน', `เพิ่มผู้ใช้งาน ${username}`);
  }
  saveDB(); closeModal(); renderUsers();
}
function deleteUser(id){
  if(!confirm('ยืนยันการลบผู้ใช้งานนี้?')) return;
  const u = DB.users.find(x=>x.id===id);
  DB.users = DB.users.filter(x=>x.id!==id);
  logActivity('ลบผู้ใช้งาน', `ลบผู้ใช้งาน ${u.username}`);
  saveDB(); renderUsers();
}

/* =========================================================================
   BOOTSTRAP
   ========================================================================= */
bootData(function(firstLoad){
  document.getElementById('login-shopname').textContent = DB.shop.name || 'Todtingtermalatod';
  if(firstLoad === undefined || firstLoad === true){
    // first time data has arrived — reveal the login form and try to resume a session
    document.getElementById('login-connecting').style.display = 'none';
    document.getElementById('login-connect-err').style.display = 'none';
    document.getElementById('login-form-fields').style.display = 'block';
    try{
      const raw = sessionStorage.getItem('posSession');
      if(raw){
        const s = JSON.parse(raw);
        const u = DB.users.find(x=>x.id===s.userId && x.username===s.username);
        if(u && u.active){ SESSION = {userId:u.id, username:u.username, name:u.name, role:u.role, permissions:u.permissions||[]}; enterApp(); }
      }
    }catch(e){}
  } else {
    // a later update (from this device or another) — just refresh what's on screen
    refreshCurrentView();
  }
});
document.getElementById('login-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
</script>
